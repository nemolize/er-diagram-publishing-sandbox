name: er-push-main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  er-push-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shop"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/regen
      - name: Commit and push the regenerated diagram to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/er.md
          git diff --cached --quiet && { echo "diagram is current"; exit 0; }
          git commit -m "Regenerate docs/er.md"
          git push origin HEAD:main
