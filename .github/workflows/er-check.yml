name: er-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  er-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shop"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/regen
      - name: Fail when the committed diagram is stale
        run: git diff --exit-code -- docs/er.md
